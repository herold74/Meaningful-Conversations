<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>Mockup A — App-Cards</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .page-a { padding: 40px 40px 56px; }

    .doc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }
    .doc-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .doc-title {
      font-size: 16pt;
      font-weight: 600;
      color: var(--content-primary);
      line-height: 1.2;
    }
    .doc-subtitle {
      font-size: 8.5pt;
      color: var(--content-tertiary);
    }
    .doc-meta {
      text-align: right;
      font-size: 8pt;
      color: var(--gray-400);
      line-height: 1.5;
    }
    .header-rule {
      height: 1px;
      background: var(--teal);
      margin-bottom: 20px;
    }

    .card {
      background: var(--gray-50);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 16px 18px;
      margin-bottom: 14px;
    }
    .card-white {
      background: #fff;
    }
    .card-title {
      font-size: 11pt;
      font-weight: 600;
      color: var(--content-primary);
      margin-bottom: 2px;
    }
    .card-subtitle {
      font-size: 8.5pt;
      color: var(--content-tertiary);
      margin-bottom: 12px;
    }

    .quote-block {
      position: relative;
      padding: 4px 0 4px 20px;
    }
    .quote-mark {
      position: absolute;
      left: 0;
      top: -4px;
      font-size: 28pt;
      line-height: 1;
      color: var(--teal);
      opacity: 0.25;
      font-family: Georgia, serif;
    }
    .quote-text {
      font-size: 10.5pt;
      font-style: italic;
      color: var(--gray-700);
      line-height: 1.5;
    }
    .quote-external {
      margin-top: 10px;
      font-size: 9pt;
      font-style: italic;
      color: var(--gray-600);
      line-height: 1.45;
      padding-left: 12px;
      border-left: 2px solid var(--gray-200);
    }

    .three-col {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    .mini-card {
      background: var(--gray-50);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 14px 14px;
    }
    .mini-card-title {
      font-size: 9.5pt;
      font-weight: 600;
      color: var(--content-primary);
      margin-bottom: 10px;
    }

    .sd-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .sd-col-title {
      font-size: 7pt;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .riemann-row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 16px;
      align-items: start;
    }

    .usage-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 20px;
    }
    .usage-item-title {
      font-size: 8.5pt;
      font-weight: 600;
      color: var(--gray-700);
    }
    .usage-item-text {
      font-size: 8.5pt;
      color: var(--gray-500);
    }

    .connector-score {
      font-size: 10pt;
      font-weight: 600;
      color: var(--teal);
      margin-bottom: 6px;
    }
    .connector-summary {
      font-size: 9pt;
      color: var(--gray-700);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .connector-strengths {
      margin-top: 8px;
    }
    .connector-strengths li {
      font-size: 8.5pt;
      color: var(--gray-600);
      margin-bottom: 3px;
      margin-left: 14px;
    }
    .disclaimer {
      font-size: 7pt;
      color: var(--gray-400);
      font-style: italic;
      text-align: center;
      margin-top: 8px;
    }
    .page-label {
      position: absolute;
      top: 12px;
      right: 40px;
      font-size: 7pt;
      color: var(--gray-300);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="pages"></div>

  <script src="sample-data.js"></script>
  <script>
    const d = window.PDF_MOCKUP_DATA;

    function shipWheel(color = '#1B7272') {
      return `<svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="4" y1="4" x2="20" y2="20" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="20" y1="4" x2="4" y2="20" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="12" y1="2" x2="12" y2="22" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="2" y1="12" x2="22" y2="12" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="7" stroke="${color}" stroke-width="2" fill="none"/>
        <circle cx="12" cy="12" r="1.75" fill="${color}"/>
      </svg>`;
    }

    function docHeader() {
      return `
        <div class="doc-header">
          <div class="doc-header-left">
            ${shipWheel()}
            <div>
              <div class="doc-title">${d.meta.title}</div>
              <div class="doc-subtitle">${d.meta.appName}</div>
            </div>
          </div>
          <div class="doc-meta">
            <div>${d.meta.date}</div>
            <div>${d.meta.email}</div>
            <div>${d.meta.provider}</div>
          </div>
        </div>
        <div class="header-rule"></div>`;
    }

    function renderBars(items, max = 5) {
      return items.map(item => `
        <div class="bar-row">
          <div class="bar-label">
            <span class="bar-dot" style="background:${item.color}"></span>
            <span class="bar-name">${item.label}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${(item.value / max) * 100}%; background:${item.color}"></div>
          </div>
          <span class="bar-value">${item.value.toFixed(1)}</span>
        </div>`).join('');
    }

    function renderListEntries(items, circleClass) {
      return items.map((item, i) => `
        <div class="list-entry">
          <span class="num-circle ${circleClass}">${i + 1}</span>
          <div>
            <div class="list-entry-title">${item.name || item.title}</div>
            <div class="list-entry-desc">${item.description || item.recommendation}</div>
          </div>
        </div>`).join('');
    }

    function renderRiemannCross() {
      const size = 140, center = size / 2, axisLen = 50;
      const ctxs = Object.values(d.riemann.contexts);
      const maxAbs = Math.max(...ctxs.flatMap(c => [Math.abs(c.x), Math.abs(c.y)]), 1);
      const scale = Math.ceil(maxAbs);
      const toPx = (val) => (val / scale) * axisLen;

      const dots = ctxs.map(c => ({
        px: center + toPx(c.x),
        py: center - toPx(c.y),
        color: c.color,
      }));

      const triangle = dots.map(p => `${p.px},${p.py}`).join(' ');

      return `
        <div class="riemann-wrap">
          <div style="font-size:6pt;font-weight:700;color:var(--gray-600);letter-spacing:3px;margin-bottom:2px">DISTANZ</div>
          <svg class="riemann-cross" viewBox="0 0 ${size} ${size}">
            <rect x="${center}" y="0" width="${center}" height="${center}" fill="#eff6ff" fill-opacity="0.5"/>
            <rect x="0" y="0" width="${center}" height="${center}" fill="#faf5ff" fill-opacity="0.5"/>
            <rect x="0" y="${center}" width="${center}" height="${center}" fill="#f9fafb" fill-opacity="0.5"/>
            <rect x="${center}" y="${center}" width="${center}" height="${center}" fill="#f0fdf4" fill-opacity="0.5"/>
            <line x1="${center - axisLen}" y1="${center}" x2="${center + axisLen}" y2="${center}" stroke="#9ca3af" stroke-width="1.2"/>
            <line x1="${center}" y1="${center - axisLen}" x2="${center}" y2="${center + axisLen}" stroke="#9ca3af" stroke-width="1.2"/>
            <polygon points="${triangle}" fill="#e5e7eb" fill-opacity="0.4" stroke="#d1d5db" stroke-width="0.8" stroke-dasharray="3,2"/>
            ${dots.map(p => `
              <circle cx="${p.px}" cy="${p.py}" r="7" fill="${p.color}" fill-opacity="0.15"/>
              <circle cx="${p.px}" cy="${p.py}" r="4.5" fill="${p.color}" stroke="#fff" stroke-width="1.5"/>
            `).join('')}
          </svg>
          <div style="font-size:6pt;font-weight:700;color:var(--gray-600);letter-spacing:3px;margin-top:-2px">NÄHE</div>
          <div class="riemann-legend">
            ${ctxs.map(c => `
              <div class="legend-item">
                <span class="legend-dot" style="background:${c.color}"></span>
                ${c.label}
              </div>`).join('')}
          </div>
        </div>`;
    }

    function renderOcean() {
      return d.ocean.map(trait => {
        const pct = ((trait.score - 1) / 4) * 100;
        return `
          <div class="ocean-row">
            <span class="ocean-name">${trait.name}</span>
            <div class="ocean-scale">
              <div class="ocean-marker" style="left:${pct}%"></div>
            </div>
            <span class="ocean-score">${trait.score.toFixed(1)}/5</span>
          </div>`;
      }).join('');
    }

    function renderConnectorBars() {
      return d.connector.dimensions.map(dim => `
        <div class="bar-row">
          <div class="bar-label" style="width:100px">
            <span class="bar-name">${dim.label}</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${dim.score * 10}%; background:var(--teal)"></div>
          </div>
          <span class="bar-value">${dim.score}/10</span>
        </div>`).join('');
    }

    function footer() {
      return `<div class="footer">Erstellt für ${d.meta.email} · Persönlich und vertraulich · ${d.meta.date} · ${d.meta.appName} by ${d.meta.provider}</div>`;
    }

    // Page 1
    const page1 = `
      <div class="page page-a">
        <span class="page-label">MOCKUP A — APP-CARDS · SEITE 1</span>
        ${docHeader()}

        <div class="card card-white">
          <div class="card-title">Persönlichkeits-Signatur</div>
          <div class="card-subtitle">Deine narrative Zusammenfassung</div>
          <div class="quote-block">
            <span class="quote-mark">"</span>
            <p class="quote-text">${d.signature.text}</p>
            ${d.signature.externalPerspective ? `<p class="quote-external">${d.signature.externalPerspective}</p>` : ''}
          </div>
        </div>

        <div class="three-col">
          <div class="mini-card">
            <div class="mini-card-title">Deine geheimen Superkräfte</div>
            ${renderListEntries(d.superpowers, 'teal')}
          </div>
          <div class="mini-card">
            <div class="mini-card-title">Potenzielle Blindspots</div>
            ${renderListEntries(d.blindspots, 'amber')}
          </div>
          <div class="mini-card">
            <div class="mini-card-title">Wachstumsmöglichkeiten</div>
            ${renderListEntries(d.growth, 'gray')}
          </div>
        </div>

        <div class="card">
          <div class="card-title">Was dich antreibt</div>
          <div class="card-subtitle">Ergebnisse · Spiral Dynamics (PVQ-21)</div>
          <div class="sd-grid">
            <div>
              <div class="sd-col-title">Ich-orientiert</div>
              ${renderBars(d.spiralDynamics.selfOriented)}
            </div>
            <div>
              <div class="sd-col-title">Wir-orientiert</div>
              ${renderBars(d.spiralDynamics.communityOriented)}
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Wie du interagierst</div>
          <div class="card-subtitle">Ergebnisse · Riemann-Thomann</div>
          <div class="riemann-row">
            ${renderRiemannCross()}
            <div>
              <div style="font-size:9pt;font-weight:600;color:var(--gray-700);margin-bottom:6px">Dein Stress-Reaktionsmuster:</div>
              ${d.riemann.stressRanking.map((s, i) => `
                <div class="stress-item ${i === 0 ? 'first' : ''}">
                  <span class="stress-num">${i + 1}</span>
                  <div>
                    <span class="stress-label">${s.label}</span>
                    <span class="stress-desc"> — ${s.desc}</span>
                  </div>
                </div>`).join('')}
              <p style="font-size:8pt;color:var(--gray-500);margin-top:8px;line-height:1.35">
                Die Punkte zeigen deine Position in drei Kontexten. Große Abstände deuten auf Flexibilität oder innere Spannung hin.
              </p>
            </div>
          </div>
        </div>

        ${footer()}
      </div>`;

    // Page 2
    const page2 = `
      <div class="page page-a">
        <span class="page-label">MOCKUP A — APP-CARDS · SEITE 2</span>
        ${docHeader()}

        <div class="card">
          <div class="card-title">Verbindungs-Signatur (The Connector)</div>
          <div class="card-subtitle">Beobachtete Fremdsicht in Gesprächen</div>
          <div class="connector-score">Verbindungs-Score: ${d.connector.overallScore}/10</div>
          <p class="connector-summary">${d.connector.summary}</p>
          ${renderConnectorBars()}
          <div class="connector-strengths">
            <div style="font-size:8.5pt;font-weight:600;color:var(--gray-700);margin-bottom:4px">Stärken in Gesprächen</div>
            <ul>${d.connector.strengths.map(s => `<li>${s}</li>`).join('')}</ul>
          </div>
          <p class="disclaimer">KI-Beobachtung aus simulierten Gesprächen (The Connector), kein psychologisches Gutachten.</p>
        </div>

        <div class="card">
          <div class="card-title">Was dich ausmacht</div>
          <div class="card-subtitle">Ergebnisse · BFI-2 (Big Five)</div>
          ${renderOcean()}
          <p style="font-size:7pt;color:var(--gray-400);text-align:center;margin-top:6px">Skala: 1 (niedrig) — 3 (mittel) — 5 (hoch)</p>
        </div>

        <div class="card card-white">
          <div class="card-title">So nutzt du dieses Profil</div>
          <div class="card-subtitle">Reflexion statt Bewertung</div>
          <div class="usage-grid">
            ${d.usageGuide.map(u => `
              <div>
                <span class="usage-item-title">${u.title}:</span>
                <span class="usage-item-text"> ${u.text}</span>
              </div>`).join('')}
          </div>
        </div>

        <div class="footnotes">
          <div style="font-size:6.5pt;font-weight:600;color:var(--gray-400);margin-bottom:4px">Quellen</div>
          ${d.footnotes.map((f, i) => `<div class="footnote-line">[${i + 1}] ${f}</div>`).join('')}
        </div>

        ${footer()}
      </div>`;

    document.getElementById('pages').innerHTML = page1 + page2;
  </script>
</body>
</html>
